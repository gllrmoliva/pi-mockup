name: Performance VPS

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL pública del VPS (ej. https://hito.example.com)"
        required: true
        type: string
      users:
        description: "Usuarios concurrentes"
        required: false
        default: "100"
        type: string
      duration:
        description: "Duración en segundos"
        required: false
        default: "900"
        type: string
      enforce:
        description: "Fallar el job si no se cumplen los umbrales"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: read

jobs:
  load-test:
    name: VPS load test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install load-test dependencies
        run: python -m pip install httpx==0.28.1
      - name: Run load test against the VPS
        env:
          PERF_PASSWORD: ${{ secrets.PERF_PASSWORD }}
        run: |
          enforce_flag=""
          if [ "${{ inputs.enforce }}" = "yes" ]; then
            enforce_flag="--enforce"
          fi
          python scripts/nfr/load_test.py \
            --base-url "${{ inputs.base_url }}" \
            --users "${{ inputs.users }}" \
            --duration "${{ inputs.duration }}" \
            --report reports/nfr/load-vps.json \
            --markdown reports/nfr/load-vps.md \
            $enforce_flag
      - name: Upload VPS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-vps-report
          path: |
            reports/nfr/load-vps.json
            reports/nfr/load-vps.md
          if-no-files-found: warn
