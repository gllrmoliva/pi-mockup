name: hito_tls

services:
  backend:
    ports: !override []
    environment:
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"

  web:
    ports: !override
      - "8081:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./frontend/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://127.0.0.1/health/ready >/dev/null || exit 1",
        ]
